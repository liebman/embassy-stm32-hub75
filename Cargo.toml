[package]
name = "embassy-stm32-hub75"
description = "A Rust driver for HUB75 LED matrix displays on STM32 microcontrollers"
repository = "https://github.com/liebman/embassy-stm32-hub75"
documentation = "https://docs.rs/embassy-stm32-hub75"
keywords = ["stm32", "led-matrix", "hub75", "embedded", "driver"]
categories = ["embedded", "hardware-support", "no-std"]
edition = "2021"
version = "0.2.0"
authors = ["liebman <liebman@zod.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "s"
overflow-checks = false

[profile.dev]
debug = true  # Symbols are nice and they don't increase the size on Flash
opt-level = 2

[dependencies]
critical-section = "1.2"
defmt = { version = "1.0.1", optional = true }
embedded-graphics = "0.8.2"
embassy-stm32 = { version = "0.6.0", default-features = false, features = [
    "unstable-pac",
] }
hub75-framebuffer = "0.10.0"

[features]
default = []
defmt = [
    "dep:defmt",
    "embassy-stm32/defmt",
    "hub75-framebuffer/defmt",
    "embedded-graphics/defmt",
]

skip-black-pixels = ["hub75-framebuffer/skip-black-pixels"]
invert-oe = ["hub75-framebuffer/invert-oe"]
tail-closes-latch = ["hub75-framebuffer/tail-closes-latch"]
lead-blank-1 = ["hub75-framebuffer/lead-blank-1"]
lead-blank-2 = ["hub75-framebuffer/lead-blank-2"]
lead-blank-4 = ["hub75-framebuffer/lead-blank-4"]
lead-blank-8 = ["hub75-framebuffer/lead-blank-8"]
lead-blank-16 = ["hub75-framebuffer/lead-blank-16"]
trail-blank-1 = ["hub75-framebuffer/trail-blank-1"]
trail-blank-2 = ["hub75-framebuffer/trail-blank-2"]
trail-blank-4 = ["hub75-framebuffer/trail-blank-4"]
trail-blank-8 = ["hub75-framebuffer/trail-blank-8"]
trail-blank-16 = ["hub75-framebuffer/trail-blank-16"]

# only used for documentation!
stm32f722 = ["embassy-stm32/stm32f722ze"]
stm32h723 = ["embassy-stm32/stm32h723zg"]
stm32wl55 = ["embassy-stm32/stm32wl55jc-cm4"]
stm32u575 = ["embassy-stm32/stm32u575zi"]
stm32h563 = ["embassy-stm32/stm32h563zi"]

[package.metadata.docs.rs]
features = ["stm32f722"]
targets = ["thumbv7em-none-eabi"]

[patch.crates-io]
# embassy-stm32 = { path = "../../../embassy/embassy-stm32" }
# embassy-time-driver = { path = "../../../embassy/embassy-time-driver" }
# embassy-time = { path = "../../../embassy/embassy-time" }
# embassy-sync = { path = "../../../embassy/embassy-sync" }
# embassy-executor = { path = "../../../embassy/embassy-executor" }
# embassy-futures = { path = "../../../embassy/embassy-futures" }

embassy-stm32 = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }
embassy-time-driver = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }
embassy-time = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }
embassy-sync = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }
embassy-executor = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }
embassy-futures = { git = "https://github.com/liebman/embassy.git", branch = "gpdma-api" }


